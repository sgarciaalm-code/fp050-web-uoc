apiVersion: apps/v1
kind: Deployment
metadata:
  name: fp050-web-uoc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fp050-web-uoc
  template:
    metadata:
      labels:
        app: fp050-web-uoc
    spec:
      containers:
        - name: web-uoc
          image: fp050-web-uoc:3
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "300m"